name: Release packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the CMake version as a GitHub release after all package checks pass (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test Linux package on baseline OS
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 /bin/bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git curl ca-certificates pkg-config patchelf python3 python3-pip fonts-dejavu-core
            git config --global --add safe.directory /src
            python3 -m pip install cmake==3.31.6
            # Python 3.12 is used for safe archive extraction in the dependency builder.
            python3 -m pip install uv==0.10.12
            uv python install 3.12
            uv run --python 3.12 --no-project python packaging/build-dependencies.py --work artifacts/release --jobs 2
            # A second invocation verifies identical builds resume without rebuilding.
            uv run --python 3.12 --no-project python packaging/build-dependencies.py --work artifacts/release --jobs 2
            export PATH="$PWD/artifacts/release/prefix/bin:$PATH"
            export PKG_CONFIG_LIBDIR="$PWD/artifacts/release/prefix/lib/pkgconfig"
            export PKG_CONFIG_PATH=
            cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/artifacts/release/prefix" -DCMAKE_INSTALL_LIBDIR=lib -DCHROMA_RELOCATABLE_INSTALL=ON -DCHROMA_REQUIRE_QUALITY_TESTS=ON
            cmake --build build-package --parallel 2
            ctest --test-dir build-package --output-on-failure
            uv run --python 3.12 --with build --no-project python -m build --wheel python --outdir artifacts/python-wheel
            uv run --python 3.12 --no-project python packaging/bundle.py --build build-package --work artifacts/release --python-wheel artifacts/python-wheel/*.whl
            uv run --python 3.12 --no-project python packaging/prepare-smoke.py --output artifacts/smoke --ffmpeg "$PWD/artifacts/release/prefix/bin/ffmpeg"
          '
      - name: Build and test macOS package
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          python3 packaging/build-dependencies.py --work artifacts/release --jobs 3
          # A second invocation verifies identical builds resume without rebuilding.
          python3 packaging/build-dependencies.py --work artifacts/release --jobs 3
          export PATH="$PWD/artifacts/release/prefix/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$PWD/artifacts/release/prefix/lib/pkgconfig"
          export PKG_CONFIG_PATH=
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_SYSROOT="$SDKROOT" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_PREFIX_PATH="$PWD/artifacts/release/prefix" -DCMAKE_INSTALL_LIBDIR=lib -DCHROMA_RELOCATABLE_INSTALL=ON -DCHROMA_REQUIRE_QUALITY_TESTS=ON
          cmake --build build-package --parallel 3
          ctest --test-dir build-package --output-on-failure
          python3 -m pip wheel --no-deps ./python --wheel-dir artifacts/python-wheel
          python3 packaging/bundle.py --build build-package --work artifacts/release --python-wheel artifacts/python-wheel/*.whl
          python3 packaging/prepare-smoke.py --output artifacts/smoke --ffmpeg "$PWD/artifacts/release/prefix/bin/ffmpeg"
      - name: Upload archives and runtime fixture
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            artifacts/smoke/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-evidence-${{ matrix.target }}
          path: |
            build-package/Testing/Temporary/
            build-package/quality/report.json
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Clean runtime (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: downloaded
      - name: Verify checksums, extract and audit
        shell: bash
        run: |
          cd downloaded/dist
          if [ "${{ runner.os }}" = macOS ]; then shasum -a 256 -c *.sha256; else sha256sum -c *.sha256; fi
          mkdir -p '../../relocated package'
          for archive in *.tar.gz; do
            case "$archive" in *-sources.tar.gz) continue ;; esac
            tar xzf "$archive" -C '../../relocated package'
          done
          cd ../..
          python3 packaging/bundle.py --audit "$PWD/relocated package/$(ls 'relocated package')"
      - name: Run with no development packages installed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v "$PWD/relocated package:/packages:ro" -v "$PWD/downloaded/artifacts/smoke:/fixture:ro" "$image" /bin/sh -ec '
              /bin/sh /fixture/smoke.sh "/packages/$(ls /packages)" /fixture /tmp/results
            '
          done
      - name: Install wheel offline and test Python runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD/relocated package:/packages:ro" -v "$PWD/downloaded/artifacts/smoke:/fixture:ro" python:3.12-slim-bookworm /bin/sh -ec '
            /bin/sh /fixture/python-smoke.sh "/packages/$(ls /packages)" /fixture /usr/local/bin/python3
          '
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Install wheel offline and test Python runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: /bin/sh downloaded/artifacts/smoke/python-smoke.sh "$PWD/relocated package/$(ls 'relocated package')" "$PWD/downloaded/artifacts/smoke" "$(command -v python3)"
      - name: Run on fresh macOS runner with empty loader environment
        if: runner.os == 'macOS'
        shell: bash
        run: /bin/sh downloaded/artifacts/smoke/smoke.sh "$PWD/relocated package/$(ls 'relocated package')" "$PWD/downloaded/artifacts/smoke" "$PWD/smoke-results"

  publish:
    name: Publish tested release
    concurrency:
      group: chroma-release-publication
      cancel-in-progress: false
    needs: [package, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: downloaded
      - name: Test publication guards without publishing
        run: python3 packaging/test-release-publication.py
      - name: Validate tag and publish all tested archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          notes="docs/releases/v$version.md"
          test -s "$notes"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            # A manual publication creates its tag only after all tests pass.
            # Refuse to reuse a tag, including one without a published release.
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq "[.[] | select(.ref == \"refs/tags/v$version\")] | length")" -eq 0
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find downloaded -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          test "${#files[@]}" -eq 9
          for target in linux-x86_64 darwin-arm64 darwin-x86_64; do
            folder=$(dirname "$(find downloaded -name "chroma-$version-$target.sha256")")
            (cd "$folder" && sha256sum -c "chroma-$version-$target.sha256")
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "v$version" "${files[@]}" --verify-tag --title "Chroma $version" --notes-file "$notes"
          else
            gh release create "v$version" "${files[@]}" --target "$GITHUB_SHA" --title "Chroma $version" --notes-file "$notes"
          fi

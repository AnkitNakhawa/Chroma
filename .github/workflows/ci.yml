name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffmpeg: ON
          - os: macos-latest
            ffmpeg: OFF
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3 libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libharfbuzz-dev libfreetype6-dev fonts-dejavu-core

      - name: Install text development libraries
        if: runner.os == 'macOS'
        run: brew install harfbuzz freetype

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCHROMA_ENABLE_FFMPEG=${{ matrix.ffmpeg }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE quality

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Python minimum supported version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then library="$PWD/build/libchroma.dylib"; else library="$PWD/build/libchroma.so"; fi
          python3 tests/python_wrapper_tests.py --library "$library"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install and test wheel in isolated environment
        shell: bash
        run: |
          python3 -m pip wheel --no-deps ./python --wheel-dir wheelhouse
          python3 -m venv "$RUNNER_TEMP/python-wrapper"
          "$RUNNER_TEMP/python-wrapper/bin/python" -m pip install --no-index --no-deps wheelhouse/*.whl
          if [ "$RUNNER_OS" = macOS ]; then library="$PWD/build/libchroma.dylib"; else library="$PWD/build/libchroma.so"; fi
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-wrapper/bin/python" "$GITHUB_WORKSPACE/tests/python_wrapper_tests.py" --installed --library "$library"


  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install media and text dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3 libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libharfbuzz-dev libfreetype6-dev fonts-dejavu-core

      - name: Install media and text dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg harfbuzz freetype

      - name: Configure mandatory quality checks
        run: cmake -S . -B build-quality -DCMAKE_BUILD_TYPE=Release -DCHROMA_ENABLE_FFMPEG=ON -DCHROMA_ENABLE_TEXT=ON -DCHROMA_REQUIRE_QUALITY_TESTS=ON

      - name: Build quality tools
        run: cmake --build build-quality --target chroma_cli chroma_graphics_equivalence --parallel 2

      - name: Check native pixels, encoded media and negative controls
        run: ctest --test-dir build-quality --output-on-failure -L quality --no-tests=error

      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-${{ matrix.os }}
          path: |
            build-quality/quality/
            build-quality/Testing/Temporary/
            !build-quality/quality/assets/*.ttf
            !build-quality/quality/assets/*.otf
          retention-days: 7
          if-no-files-found: warn
